name: Test Product CI (Simple)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Simple CI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Check Code Syntax & Structure
        run: node -c src/server.js src/app.js src/config/db.js src/controllers/product.controller.js src/models/product.model.js

      - name: Run Unit / In-Memory Integration Tests
        run: npm test
