version: '3.8'

services:
  nammongodb:
    image: mongo:7.0
    container_name: nammongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-prod-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - product-prod-net

  product-api:
    image: ${DOCKERHUB_USERNAME:-nguyenhuuloc0303}/product-api:latest
    container_name: product-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://nammongodb:27017/productdb
      - NODE_ENV=production
    depends_on:
      nammongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - product-prod-net

  # Watchtower enables automatic CD from Docker Hub to Local Docker Engine!
  # It polls Docker Hub every 30 seconds, detects new image pushes, and gracefully restarts product-api.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 30 --cleanup product-api
    depends_on:
      - product-api
    networks:
      - product-prod-net

volumes:
  mongo-prod-data:

networks:
  product-prod-net:
    driver: bridge
